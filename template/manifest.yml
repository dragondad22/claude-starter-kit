# template/manifest.yml — the shipped-file allowlist (T23.2)
#
# Maps each module to the files it ships and the trigger that scaffolds it.
# ALLOWLIST MODEL: only files listed here ever land in a project. Anything in
# template/ that is not listed (module READMEs, this file) is kit metadata and
# does not ship — new kit-dev files are safe by default.
#
# Paths are relative to the module's directory (template/core/ or
# template/modules/<name>/) and equal the file's destination relative to the
# project root: core/CLAUDE.md -> <project>/CLAUDE.md.
#
# Triggers follow the T3.9 trigger table: modules are AI-detected at session
# start / preflight and OFFERED, never silently applied. The kit self-test CI
# (issue #6) validates this manifest: every listed file exists, and no listed
# file references a kit-dev path.
#
# STAGING (T3.10): module paths above are the ACTIVE destinations. At
# inception the scaffold engine additionally stages every module file
# verbatim at <project>/bootstrap/modules/<name>/<path>, plus a copy of this
# manifest, so trigger-time installs (ai/scripts/scaffold-module.sh) work
# offline and version-consistent. The engine also generates
# <project>/bootstrap/KIT_VERSION (T18) — generated, not copied, so not
# listed here.
#
# Decision record: docs/plans/2026-07-08-kit-review-topics.md (T23.2, T3.7, T3.9).

version: 1

# SEEDED FILES (#262) — shipped as starting skeletons the project then owns.
#
# A seeded file's content belongs to the adopting project the moment it is
# filled: a register, an index, a rolling log, the project's own history. Any
# tool that re-derives an installed tree from this template must treat these as
# create-if-absent and NEVER overwrite — re-deriving one destroys recorded
# answers that exist nowhere else. Everything not listed here is DERIVED: the
# kit owns the content and re-deriving it is the correct, lossless action.
#
# The test is "after install, whose information is in this file?" A file the
# project merely *configures* (.gitignore, .claude/settings.json) is not seeded
# — divergence there is an adaptation, declared and reasoned per project.
#
# This lives in the manifest rather than in a consuming tool because it is a
# fact about the product, not about any one installation. Adding a file below
# without classifying it here is the failure #262 exists to stop: the kit's own
# conformance tooling refuses to re-derive an instance while a seeded file is
# unclassified, and csk phase 3's three-way-merge upgrade (#248) needs the same
# set to know what it must never overwrite.
#
# Paths are destinations relative to the project root, and each must also appear
# in core.files or modules.<name>.files below; the manifest validator checks it.
seeded:
  - CHANGELOG.md
  - VERSION
  - docs/GLOSSARY.md
  - docs/PERSONAS.md
  - docs/evergreen-log.md
  - docs/architecture/decisions/ADR_INDEX.md
  - docs/compliance/COMPLIANCE_REGISTER.md
  - docs/registers/PRODUCT_REGISTER.md
  - docs/releases/README.md
  - docs/uat/JOURNEY_REGISTRY.md

