# self-answers.yml — this project's inception answers (T36.3).
#
# The kit is an adopter of its own product, so it has to answer the same
# placeholder questions every adopting project answers. These are the values
# scripts/self-conform.py fills into the root instance when deriving it from
# template/. Registry of what each token means: bootstrap/PLACEHOLDERS.md.
#
# Answered honestly for what this repo actually is: a documentation-and-scripts
# project with no runtime, no database, and no user-facing application.
#
# Kit-dev file: does not ship.

